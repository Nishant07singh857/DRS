server {
    listen 80;
    server_name localhost;
    server_tokens off;

    # SEC-M5: basic security headers (frontend + proxied API dono
    # par lagte hain, kyunki yehi single entry point hai).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # SEC-H3: nginx default client_max_body_size 1 MB hota hai —
    # bina iske 1 MB se bada har upload proxy par hi 413 ho jata
    # tha, jabki Flask limit 500 MB hai. MAX_UPLOAD_MB se match karo.
    client_max_body_size 500m;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
