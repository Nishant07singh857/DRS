# DRS docker-compose — SECURITY NOTES (Phase 1, SEC-C5):
# - Data services (redis, timescaledb) ke koi host ports NAHI hain:
#   wo sirf drs-network par milte hain. Pehle 6379/5432 host par
#   khule the, bina password ke — Redis access = Celery task
#   injection tha. Host port-mapping sirf dev-only hai: agar local
#   debug ke liye chahiye to temporarily ports: add karo, kabhi
#   production compose me wapas mat lao.
# - Redis par requirepass hai; broker/backend URLs me password
#   lagta hai (REDIS_PASSWORD .env se aata hai, fail-fast:
#   ${REDIS_PASSWORD:?} unset/empty par compose ruk jata hai).
# - POSTGRES_PASSWORD ka koi :-password fallback nahi hai (SEC-H5).
# - Backend/worker TRUST_PROXY=1 par chalte hain kyunki frontend
#   nginx unke saamne single trusted proxy hai (SEC-H1).

services:
  redis:
    image: "redis:alpine"
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    networks:
      - drs-network

  timescaledb:
    image: timescale/timescaledb-ha:pg14-latest
    container_name: drs_timescaledb
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-drsdb}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - timescale-data:/var/lib/postgresql/data
    networks:
      - drs-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "5001:5000"
    environment:
      - DATABASE_HOST=timescaledb
      - REDIS_HOST=redis
      - POSTGRES_DB=${POSTGRES_DB:-drsdb}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/0
      - RATELIMIT_STORAGE_URI=redis://:${REDIS_PASSWORD}@redis:6379/1
      - TRUST_PROXY=1
    env_file: ./.env
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      - timescaledb
      - redis
    networks:
      - drs-network

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    command: celery -A app.celery worker --loglevel=info
    environment:
      - DATABASE_HOST=timescaledb
      - REDIS_HOST=redis
      - POSTGRES_DB=${POSTGRES_DB:-drsdb}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/0
      - RATELIMIT_STORAGE_URI=redis://:${REDIS_PASSWORD}@redis:6379/1
      - TRUST_PROXY=1
    env_file: ./.env
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      - redis
      - timescaledb
      - backend
    networks:
      - drs-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - drs-network

volumes:
  timescale-data:

networks:
  drs-network:
    driver: bridge
